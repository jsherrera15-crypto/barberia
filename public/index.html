<!doctype html>
<html lang="es">
  <head>
    <!-- @include partials/head-base.html -->
    <title>Reserva tu cita · Barbería El Corte</title>
    <link href="/css/cliente.css" rel="stylesheet" />
  </head>
  <body>
    <header id="top">
      <!-- @include partials/navbar.html -->
    </header>

    <main id="app" class="container pb-5">
      <!-- Portada -->
      <section class="hero">
        <div>
          <div class="meta">
            <span id="ratingGeneral"></span>
            <span><i class="bi bi-geo-alt"></i> Pereira, Risaralda</span>
            <span
              ><i class="bi bi-clock"></i> Lun a Sáb · 9:00 am a 6:00 pm</span
            >
          </div>
          <h1>Barbería El Corte</h1>
          <p>
            Cortes, fades y barba con el profesional que tú elijas. Escoge tu
            servicio, mira la agenda de tu barbero y reserva en menos de un
            minuto.
          </p>
          <button class="btn btn-ink btn-lg mt-3" id="btnReservar">
            Reservar mi cita
          </button>
        </div>
        <div class="polebig" aria-hidden="true"></div>
      </section>

      <!-- Servicios -->
      <section id="serv">
        <h2 class="sec">¿Qué servicio quieres?</h2>
        <div id="listaServicios"></div>
      </section>
    </main>

    <!-- Plantillas: home.js las copia y las llena con los datos -->
    <template id="tpl-categoria">
      <h3 class="h5 mt-3 mb-2" data-ref="titulo"></h3>
      <div class="row g-3" data-ref="lista"></div>
    </template>

    <template id="tpl-servicio">
      <div class="col-6 col-md-4">
        <button class="svc" data-ref="boton">
          <b class="n" data-ref="nombre"></b>
          <span class="m">
            <span
              ><i class="bi bi-clock"></i> <span data-ref="duracion"></span
            ></span>
            <b data-ref="precio"></b>
          </span>
        </button>
      </div>
    </template>

    <!-- @include partials/rate.html -->
    <!-- @include partials/auth-modal.html -->

    <!-- @include partials/scripts-base.html -->
    <script src="/js/pages/home.js"></script>
  </body>
</html>
