<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panel · Barberos · Barbería El Corte</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="/css/base.css" rel="stylesheet" />
    <link href="/css/panel.css" rel="stylesheet" />
  </head>
  <body>
    <header id="top">
      <!-- @include partials/navbar.html -->
    </header>

    <main id="app" class="container pb-5">
      <!-- @include partials/panel-sin-acceso.html -->

      <div id="panel" hidden>
        <!-- @include partials/panel-head.html -->
        <div class="box">
          <div class="row g-2 mb-4">
            <div class="col-md-3"><input id="nNombre" class="form-control" placeholder="Nombre" /></div>
            <div class="col-md-4"><input id="nCorreo" class="form-control" placeholder="Correo" /></div>
            <div class="col-md-3"><input id="nClave" type="password" class="form-control" placeholder="Contraseña (mín. 6)" /></div>
            <div class="col-md-2"><button class="btn btn-ink w-100" id="btnCrear">Crear barbero</button></div>
          </div>
          <div id="errorBarbero" class="text-danger small mb-2"></div>
          <div id="listaBarberos"></div>
        </div>
      </div>
    </main>

    <!-- Plantilla: panel-barberos.js la copia y la llena con los datos -->
    <template id="tpl-barbero-fila">
      <div class="d-flex justify-content-between align-items-center border-top py-2">
        <span><b data-ref="nombre"></b> <span class="text-secondary" data-ref="correo"></span></span>
        <button class="btn btn-sm btn-line" data-ref="eliminar">Eliminar</button>
      </div>
    </template>

    <!-- @include partials/auth-modal.html -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/core/utils.js"></script>
    <script src="/js/core/data.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/core/layout.js"></script>
    <script src="/js/pages/panel-barberos.js"></script>
  </body>
</html>
