<!doctype html>
<html lang="es">
  <head>
    <!-- @include partials/head-base.html -->
    <title>Panel · Barberos · Barbería El Corte</title>
    <link href="/css/panel.css" rel="stylesheet" />
  </head>
  <body>
    <header id="top">
      <!-- @include partials/navbar.html -->
    </header>

    <main id="app" class="container pb-5">
      <!-- @include partials/panel-sin-acceso.html -->

      <div id="panel" hidden>
        <!-- @include partials/panel-head.html -->
        <div class="box">
          <div class="row g-2 mb-4">
            <div class="col-md-3"><input id="nNombre" type="text" data-input-rule="letters" maxlength="100" class="form-control" placeholder="Nombre" /></div>
            <div class="col-md-4"><input id="nCorreo" type="email" class="form-control" placeholder="Correo" /></div>
            <div class="col-md-3"><input id="nClave" type="password" minlength="6" maxlength="128" autocomplete="new-password" class="form-control" placeholder="Contraseña (mín. 6)" /></div>
            <div class="col-md-2"><button class="btn btn-ink w-100" id="btnCrear">Crear barbero</button></div>
          </div>
          <div id="errorBarbero" class="text-danger small mb-2"></div>
          <div id="listaBarberos"></div>
        </div>
      </div>
    </main>

    <!-- Plantilla: panel-barberos.js la copia y la llena con los datos -->
    <template id="tpl-barbero-fila">
      <div class="d-flex justify-content-between align-items-center border-top py-2">
        <span><b data-ref="nombre"></b> <span class="text-secondary" data-ref="correo"></span></span>
        <button class="btn btn-sm btn-line" data-ref="eliminar">Eliminar</button>
      </div>
    </template>

    <!-- @include partials/auth-modal.html -->

    <!-- @include partials/scripts-base.html -->
    <script src="/js/pages/panel-barberos.js"></script>
  </body>
</html>
