<!doctype html>
<html lang="es">
  <head>
    <!-- @include partials/head-base.html -->
    <title>Panel · Citas · Barbería El Corte</title>
    <link href="/css/panel.css" rel="stylesheet" />
  </head>
  <body>
    <header id="top">
      <!-- @include partials/navbar.html -->
    </header>

    <main id="app" class="container pb-5">
      <!-- @include partials/panel-sin-acceso.html -->

      <div id="panel" hidden>
        <!-- @include partials/panel-head.html -->
        <div class="box">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Cliente</th>
                  <th data-admin>Barbero</th>
                  <th>Servicio</th>
                  <th>Estado</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="filas"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Plantillas: panel-citas.js las copia y las llena con los datos -->
    <template id="tpl-fila">
      <tr>
        <td><span data-ref="dia"></span><br><b data-ref="hora"></b></td>
        <td><span data-ref="cliente"></span><br><small class="text-secondary" data-ref="tel"></small></td>
        <td data-admin data-ref="barbero"></td>
        <td data-ref="servicio"></td>
        <td><span class="badge-e" data-ref="estado"></span></td>
        <td class="text-nowrap" data-ref="acciones"></td>
      </tr>
    </template>

    <template id="tpl-fila-vacia">
      <tr><td colspan="6" class="text-secondary">Todavía no hay citas.</td></tr>
    </template>

    <template id="tpl-acciones-cita">
      <button class="btn btn-sm btn-ink" data-estado="completada">Completar</button> <button class="btn btn-sm btn-line" data-estado="no_asistio">No asistió</button> <button class="btn btn-sm btn-line" data-estado="cancelada">Cancelar</button>
    </template>

    <!-- @include partials/auth-modal.html -->

    <!-- @include partials/scripts-base.html -->
    <script src="/js/pages/panel-citas.js"></script>
  </body>
</html>
