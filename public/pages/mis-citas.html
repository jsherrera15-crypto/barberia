<!doctype html>
<html lang="es">
  <head>
    <!-- @include partials/head-base.html -->
    <title>Mis citas · Barbería El Corte</title>
    <link href="/css/cliente.css" rel="stylesheet" />
  </head>
  <body>
    <header id="top">
      <!-- @include partials/navbar.html -->
    </header>

    <main id="app" class="container pb-5">
      <!-- Sin sesión -->
      <div class="box mt-5 text-center" id="sinSesion" hidden>
        <h2 class="h4">Inicia sesión para ver tus citas</h2>
        <button class="btn btn-ink mt-2" id="btnAcceder">Accede</button>
      </div>

      <!-- Con sesión -->
      <div id="contenido" hidden>
        <a class="btn btn-link p-0 mt-4 text-decoration-none" href="/index.html#serv">
          <i class="bi bi-arrow-left"></i> Volver a servicios
        </a>
        <h2 class="sec">Mis citas</h2>
        <div id="listaCitas"></div>
        <p class="text-secondary" id="sinCitas" hidden>
          Aún no tienes citas. <a href="/index.html#serv">Agenda la primera</a>.
        </p>
      </div>
    </main>

    <!-- Plantillas: mis-citas.js las copia y las llena con los datos -->
    <template id="tpl-cita">
      <div class="box mb-3 d-flex justify-content-between flex-wrap gap-3">
        <div>
          <b data-ref="servicio"></b> con <span data-ref="barbero"></span><br>
          <span class="text-secondary" data-ref="detalle"></span>
        </div>
        <div class="text-end">
          <span class="badge-e" data-ref="estado"></span>
          <div class="mt-2" data-ref="acciones"></div>
        </div>
      </div>
    </template>

    <template id="tpl-cancelar">
      <button class="btn btn-sm btn-line">Cancelar</button>
    </template>

    <template id="tpl-calificada">
      <span class="text-warning" data-ref="estrellas"></span>
    </template>

    <template id="tpl-calificar">
      <span class="stars">¿Cómo te fue? <button>★</button><button>★</button><button>★</button><button>★</button><button>★</button></span>
    </template>

    <!-- @include partials/auth-modal.html -->

    <!-- @include partials/scripts-base.html -->
    <script src="/js/pages/mis-citas.js"></script>
  </body>
</html>
